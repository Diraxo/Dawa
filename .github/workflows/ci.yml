name: CI

on:
  push:
    branches: [main, fix-branch]
  pull_request:
    branches: [main]

jobs:
  typecheck-web:
    name: TypeScript (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carehub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carehub-web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit

  typecheck-mobile:
    name: TypeScript (Mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

      - name: Audit web
        working-directory: carehub-web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
