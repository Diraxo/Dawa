name: Android Build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile to run"
        type: choice
        default: production-apk
        options:
          - production-apk
          - preview
  push:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Build (Android APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'production-apk' }}" \
            --non-interactive \
            --wait \
            --output "build/dawa-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawa-android-${{ github.event.inputs.profile || 'production-apk' }}-${{ github.run_number }}
          path: build/dawa-android.apk
          retention-days: 30
          if-no-files-found: error
