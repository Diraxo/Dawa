name: E2E Tests

on:
  push:
    branches: [main, fix-branch]
    paths:
      - 'carehub-web/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'carehub-web/**'

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: carehub-web

    env:
      # Public env — safe to include (no secrets)
      NEXT_PUBLIC_SUPABASE_URL:        ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:   ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STREAM_API_KEY:      ${{ secrets.NEXT_PUBLIC_STREAM_API_KEY }}
      NEXT_PUBLIC_AGORA_APP_ID:        ${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
      # Server-only secrets
      SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLERK_SECRET_KEY:                ${{ secrets.CLERK_SECRET_KEY }}
      STREAM_API_SECRET:               ${{ secrets.STREAM_API_SECRET }}
      # Test credentials (dedicated test accounts, NOT production users)
      E2E_PATIENT_EMAIL:    ${{ secrets.E2E_PATIENT_EMAIL }}
      E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}
      E2E_DOCTOR_EMAIL:     ${{ secrets.E2E_DOCTOR_EMAIL }}
      E2E_DOCTOR_PASSWORD:  ${{ secrets.E2E_DOCTOR_PASSWORD }}
      E2E_ADMIN_EMAIL:      ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD:   ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carehub-web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          # Clerk middleware needs these at build time
          NEXT_PUBLIC_CLERK_SIGN_IN_URL:  /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL:  /sign-up

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: carehub-web/playwright-report/
          retention-days: 14
