name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC

jobs:
  audit-mobile:
    name: Audit Mobile App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  audit-web:
    name: Audit Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carehub-web/package-lock.json
      - run: cd carehub-web && npm ci --ignore-scripts
      - run: cd carehub-web && npm audit --audit-level=high
